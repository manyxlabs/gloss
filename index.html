<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Each page's title, description, languages and link preview, in its language: see src/i18n/pages.ts. -->
    <!--page-head-->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050506" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <script>
      // Runs before first paint so a saved or system theme never flashes the other one.
      // `gloss:theme` is where Gloss kept the choice before it took the portfolio's key.
      try {
        var theme = localStorage.getItem('theme') || localStorage.getItem('gloss:theme');
      } catch (e) {}
      if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gloss by Manyx Labs" />
    <meta property="og:image" content="https://gloss.manyxlabs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- What crawlers and visitors without JavaScript see; the app replaces nothing here. -->
    <!--page-noscript-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
